[workspace]
members = ["rpc"]

[package]
name = "libcfd"
version = "0.2.0"
edition = "2024"

[features]
default = ["quick-tunnel", "named-tunnel", "quic-edge", "h2-edge"]
# Quick Tunnel support: the trycloudflare.com HTTP API client and `QuickTunnel`.
quick-tunnel = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "dep:serde",
    "dep:serde_json",
    "dep:uuid",
]
# Named Tunnel support: `NamedTunnel` and the credentials-file loader.
named-tunnel = ["dep:serde", "dep:serde_json", "dep:uuid"]
# QUIC edge transport. Defaults to the quinn backend (pure-Rust rustls/ring);
# enable `quic-edge-quiche` to use quiche (BoringSSL via `boring`) instead.
# The backends are mutually exclusive: quiche wins when both are enabled.
quic-edge = ["quic-edge-quinn"]
quic-edge-quinn = ["dep:quinn", "dep:rustls", "dep:rustls-pki-types"]
quic-edge-quiche = ["dep:quiche", "dep:boring"]
# HTTP/2 edge transport.
h2-edge = [
    "dep:h2",
    "dep:bytes",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:serde_json",
]
# Adapter letting an axum Router serve as an HttpOrigin (HTTP only; see docs).
axum-origin = ["dep:axum", "dep:tower", "dep:bytes"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
base64 = "0.23"
boring = { version = "4.22", optional = true }
bytes = { version = "1.12", optional = true }
futures-io = "0.3"
futures-util = { version = "0.3", features = ["io"] }
getrandom = "0.4"
h2 = { version = "0.4", optional = true }
http = "1.5"
libcfd-rpc = { version = "0.2.0", path = "rpc" }
quiche = { version = "0.29", optional = true }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "futures-io"], optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha1 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", default-features = false, features = ["net", "rt", "time", "io-util", "sync", "macros", "fs"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["logging", "ring", "tls12"] }
tower = { version = "0.5", optional = true }
tracing = "0.1"
uuid = { version = "1.24", default-features = false, optional = true }
webpki-roots = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing-subscriber = "0.3"

[[example]]
name = "quick_tunnel"
required-features = ["quick-tunnel", "quic-edge"]

[[example]]
name = "h2_tunnel"
required-features = ["quick-tunnel", "h2-edge"]

[[example]]
name = "named_tunnel"
required-features = ["named-tunnel", "quic-edge", "h2-edge"]

[[example]]
name = "origin_ws_tcp"
required-features = ["quick-tunnel", "quic-edge"]

[[example]]
name = "axum_tunnel"
required-features = ["quick-tunnel", "quic-edge", "axum-origin"]
