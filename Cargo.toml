[workspace]
members = ["rpc"]

[package]
name = "libcfd"
version = "0.1.0"
edition = "2024"

[features]
default = ["quick-tunnel", "named-tunnel", "quic-edge", "h2-edge"]
# Quick Tunnel support: the trycloudflare.com HTTP API client and `QuickTunnel`.
quick-tunnel = []
# Named Tunnel support: `NamedTunnel` and the credentials-file loader.
named-tunnel = []
# QUIC edge transport (quiche).
quic-edge = []
# HTTP/2 edge transport.
h2-edge = []
# Adapter letting an axum Router serve as an HttpOrigin (HTTP only; see docs).
axum-origin = ["dep:axum", "dep:tower"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"], optional = true }
base64 = "0.23.1"
boring = "4.22"
bytes = "1.12.1"
futures-io = "0.3.34"
futures-util = { version = "0.3.34", features = ["io"] }
h2 = "0.4.15"
http = "1.5.0"
libcfd-rpc = { version = "0.1.0", path = "rpc" }
quiche = "0.29.3"
rustls = "0.23.43"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "rt", "rt-multi-thread", "time", "io-util", "sync", "macros", "fs"] }
tokio-rustls = "0.26.4"
tower = { version = "0.5.3", optional = true }
tracing = "0.1.44"
uuid = { version = "1.24.0", default-features = false }
webpki-roots = "1.0.9"

[dev-dependencies]
rcgen = "0.14.9"
tokio = { version = "1.53.1", features = ["signal"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing-subscriber = "0.3.23"

[[example]]
name = "quick_tunnel"
required-features = ["quick-tunnel", "quic-edge"]

[[example]]
name = "h2_tunnel"
required-features = ["quick-tunnel", "h2-edge"]

[[example]]
name = "named_tunnel"
required-features = ["named-tunnel", "quic-edge"]

[[example]]
name = "origin_ws_tcp"
required-features = ["quick-tunnel", "quic-edge"]

[[example]]
name = "axum_tunnel"
required-features = ["quick-tunnel", "quic-edge", "axum-origin"]
